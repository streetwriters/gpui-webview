name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-nested:
    name: linux (nested, wl_shm)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev
      - name: nested_e2e
        env:
          E2E_FORCE_SHM: "1"
          GPUI_WEBVIEW_DEBUG: "1"
        run: cargo test --locked --features nested --test nested_e2e -- --nocapture

  windows-webview2:
    name: windows (WebView2)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: windows_e2e
        env:
          GPUI_WEBVIEW_DEBUG: "1"
        run: cargo test --locked --features wry,test-support --test windows_e2e -- --nocapture
