[package]
name = "gpui-webview"
version = "0.1.0"
edition = "2024"
description = "Pooled, clipped live web surfaces for GPUI applications (WKWebView / WebView2 / WebKitGTK / wasm iframe)"
license = "GPL-3.0-or-later"
repository = "https://github.com/streetwriters/notesnook"
documentation = "https://github.com/streetwriters/notesnook/tree/main/apps/desktop-gpui-spike/crates/gpui-webview"
keywords = ["gpui", "webview", "wry", "wasm"]
categories = ["gui"]
# Incubating inside the spike workspace until a second project adopts it
# (EMBEDS.md §15/Open questions). The manifest is publish-ready otherwise:
# a move out needs no code or manifest change beyond this flag.
publish = false

[features]
# Pure-Rust recording backend: the whole crate always compiles everywhere and
# the policy/pool tests run without a browser engine.
default = ["mock"]
mock = []
# wasm32 only: a clip `<div>` + `<iframe>` stacked over GPUI's canvas.
web = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys"]
# Native only: wry hosts the platform engine (WKWebView / WebView2 / WebKitGTK).
wry = [
    "dep:wry",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-web-kit",
    "dep:windows",
    "dep:webview2-com",
]
# Linux only: the in-process nested Wayland compositor (smithay). See
# `backend/nested.rs` and EMBEDS.md §10.3.
nested = ["wry", "dep:smithay", "dep:libc", "dep:gtk", "dep:webkit2gtk", "dep:image"]
# Optional fast paths; every backend must work without them (EMBEDS.md §14).
# Linux only: import committed dma-bufs as GPU textures (the `linux-dmabuf`
# fast path), on our GPUI fork's import API; off by default, so the backend
# runs `wl_shm`. Every backend must work without it (EMBEDS.md §14).
dma-buf = []
wayland-surface = []
# "Open in window" / fullscreen presentations (a separate GPUI window).
window = []
# Test-support hooks (e.g. `page_snapshot`) the platform E2E drives; off for
# every ordinary consumer so the public API stays clean.
test-support = []

[dependencies]
anyhow = "1"
gpui-kit = { version = "0.7.3", default-features = false }
# `std::time::Instant` panics on wasm32-unknown-unknown; this is `performance.now()` there.
web-time = "1"

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.web-sys]
version = "0.3"
optional = true
features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlIFrameElement",
    "DomTokenList",
    "CssStyleDeclaration",
    "Blob",
    "BlobPropertyBag",
    "Url",
]

[dependencies.js-sys]
version = "0.3"
optional = true

[dependencies.wry]
version = "0.57"
optional = true
default-features = false
features = ["os-webview"]

# macOS native surface (EMBEDS.md §10.1). Versions track wry's own objc2 set so
# cargo unifies them into one binding of the same framework crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["std", "NSView"] }
objc2-foundation = { version = "0.3", optional = true, features = ["std", "NSGeometry"] }
objc2-web-kit = { version = "0.3", optional = true, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKWebpagePreferences"] }

# Windows native surface (EMBEDS.md §10.2): a WebView2 child HWND inside our
# clip container. `windows` carries the Win32 message/geometry API and
# `webview2-com` the policy handlers (context menu, process failure, new
# windows, permissions). Both pin the versions wry 0.57 and gpui-pre-windows
# use, so cargo unifies them.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = { version = "0.39", optional = true }

# Linux native surface (EMBEDS.md §10.3): an in-process nested Wayland
# compositor built on **smithay** (user decision, 2026-10-12). GTK/WebKitGTK
# (through wry) connects to a private socket this process serves; the committed
# `wl_shm` buffers become GPUI images the app paints.
[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7", optional = true, default-features = false, features = [
    "wayland_frontend",
    "desktop",
] }
# `makedev` for the linux-dmabuf feedback's device id, `dup` for the frame
# descriptors.
libc = { version = "0.2", optional = true }
gtk = { version = "0.18", optional = true }
# WebKitGTK's settings (the script switch); pinned to wry's own version so the
# `WebView` type is the same crate.
webkit2gtk = { version = "=2.0.2", optional = true, features = ["v2_38"] }
# The committed `wl_shm` buffers become GPUI frame images.
image = { version = "0.25", default-features = false, optional = true }

# Headless end-to-end check of the nested compositor: starts the private
# compositor, lets GTK/WebKitGTK render into it and asserts a frame comes back
# with the configured size and real pixels. `harness = false` so it runs on the
# main thread (GTK requirement). Needs GTK3 + WebKitGTK 4.1 at runtime.
[[test]]
name = "nested_e2e"
path = "tests/nested_e2e.rs"
harness = false
required-features = ["nested"]

# Windows end-to-end (`scripts/windows-run.sh`, WG2): a real GPUI window hosts
# a live surface; the page is read back with WebView2's own snapshot and the
# window with Windows.Graphics.Capture (falling back to GDI). `harness = false`
# so it runs on the main thread (WebView2 requirement); needs an interactive
# Windows session and the WebView2 Runtime.
[[test]]
name = "windows_e2e"
path = "tests/windows_e2e.rs"
harness = false
required-features = ["wry", "test-support"]

[dev-dependencies]
gpui-kit = { version = "0.7.3", default-features = false, features = ["test-support"] }

# The `nested_e2e` test imports and samples committed dma-bufs through the same
# code the app uses, and builds the compositor's feedback from the same
# capability query. Linux-only (the test is).
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu = { git = "https://github.com/streetwriters/gpui-fast", branch = "rn-gpui-linux" }

# The Windows E2E drives Win32 directly (GDI fallback readback, window and
# process checks), Windows.Graphics.Capture (the composited-window proof),
# maps GPUI's window raw handle and decodes WebView2's PNG page snapshot; an
# integration test is its own crate, so it needs all of it.
[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
